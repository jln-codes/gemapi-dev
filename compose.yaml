name: gemapi-dev
services:
  app:
    build: .
    environment:
      AUTH_ORIGIN: ${AUTH_ORIGIN:-http://127.0.0.1:${GEMAPI_PORT:-8080}}
      AUTH_READER_GROUP: ${AUTH_READER_GROUP:-milieux_consultation}
      AUTH_MAX_SESSIONS: ${AUTH_MAX_SESSIONS:-20}
      AUTH_TECHNICAL_RESERVE: ${AUTH_TECHNICAL_RESERVE:-1}
      AUTH_CONNECTION_BUDGET: ${AUTH_CONNECTION_BUDGET:-21}
      AUTH_PER_ACCOUNT: ${AUTH_PER_ACCOUNT:-3}
      AUTH_MAX_HANDSHAKES: ${AUTH_MAX_HANDSHAKES:-3}
      AUTH_IDLE_SECONDS: ${AUTH_IDLE_SECONDS:-7200}
      AUTH_ABSOLUTE_SECONDS: ${AUTH_ABSOLUTE_SECONDS:-43200}
      AUTH_ATTEMPTS_PER_MINUTE: ${AUTH_ATTEMPTS_PER_MINUTE:-10}
      AUTH_GLOBAL_ATTEMPTS_PER_MINUTE: ${AUTH_GLOBAL_ATTEMPTS_PER_MINUTE:-60}
      AUTH_DEPLOYMENT: ${AUTH_DEPLOYMENT:-production}
      AUTH_DEMO_PREFILL: ${AUTH_DEMO_PREFILL:-0}
      AUTH_DEMO_LOGIN: ${AUTH_DEMO_LOGIN:-}
      AUTH_DEMO_PASSWORD: ${AUTH_DEMO_PASSWORD:-}
      AUTH_DEMO_PER_ACCOUNT: ${AUTH_DEMO_PER_ACCOUNT:-3}
      DATABASE_SCHEMA: ${DATABASE_SCHEMA:-gemapi}
      DATABASE_URL: ${DATABASE_URL:-}
      DATABASE_READONLY_URL: ${DATABASE_READONLY_URL:-}
      DATABASE_AI_READONLY_URL: ${DATABASE_AI_READONLY_URL:-}
      MEDIA_BACKEND: filesystem
      MEDIA_ROOT: /var/lib/gemapi/media
      BASEMAP_RASTER_URL: http://basemap:8788
    volumes:
      - media:/var/lib/gemapi/media

  basemap:
    build: ./services/plan-ign-raster
    environment:
      CACHE_ROOT: /var/cache/digues-app/basemaps
      BASEMAP_CATALOG_FILE: /srv/plan-ign-raster/basemaps.toml
      CARTOGRAPHIC_CACHE_PRODUCTS_FILE: /srv/plan-ign-raster/cartographic_caches.json
      CACHE_GENERATION: ${BASEMAP_CACHE_GENERATION:-2026-09}
    volumes:
      - basemap-cache:/var/cache/digues-app/basemaps
      - ./webapp/backend/digues_webapp/basemaps.toml:/srv/plan-ign-raster/basemaps.toml:ro
      - ./webapp/backend/digues_webapp/cartographic_caches.json:/srv/plan-ign-raster/cartographic_caches.json:ro
    stop_grace_period: 90s

  caddy:
    image: caddy:2-alpine
    ports:
      - "127.0.0.1:${GEMAPI_PORT:-8080}:8080"
    depends_on:
      - app
      - basemap
    volumes:
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro

volumes:
  media:
  basemap-cache:
