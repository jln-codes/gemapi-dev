[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "digues-app"
version = "0.1.0"
description = "Composants techniques dérivés de Digues App"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "matplotlib>=3.8,<4",
    "Pillow>=12.1,<13",
    "psycopg[binary]>=3.2,<4",
    "pypdf>=5,<7",
    "python-dotenv>=1.0,<2",
    "reportlab>=4.0,<6",
    "requests>=2.31,<3",
    "cryptography>=41,<47",
    "jsonschema>=4.10.3,<5",
]

[project.optional-dependencies]
test = ["pytest>=7.4,<10", "setuptools>=68", "wheel>=0.42,<1"]

[tool.setuptools.packages.find]
include = ["digues_app*"]
