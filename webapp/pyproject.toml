[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "digues-webapp"
version = "0.1.0"
description = "Socle web gemapi.dev"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "digues-app==0.1.0",
    "fastapi>=0.115,<1",
    "httpx==0.28.1",
    "matplotlib>=3.8,<4",
    "psycopg[binary]>=3.2,<4",
    "pydantic>=2,<3",
    "pypdf>=5,<7",
    "python-dotenv>=1.0,<2",
    "reportlab>=4.0,<6",
    "requests>=2.31,<3",
    "cryptography>=41,<47",
    "uvicorn>=0.34,<1",
    "Pillow>=12.1,<13",
]

[project.optional-dependencies]
test = ["setuptools>=68", "wheel>=0.42,<1"]

[tool.setuptools.package-data]
digues_webapp = ["basemaps.toml", "cartographic_caches.json", "lidar_prototype.html"]
"digues_webapp.frontend_assets" = ["**/*"]
